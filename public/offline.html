<!doctype html>
<!-- Shown by the service worker (sw.js) when there's no internet connection.
     It's a plain static page so it works offline; texts are in all three
     languages and the one matching the chosen language is shown. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>FoodRescue</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf6f1;
        color: #1c1917; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { padding: 24px; max-width: 360px; }
      .icon { width: 72px; height: 72px; border-radius: 18px; background: #c2553a; display: inline-grid; place-items: center; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #57534e; margin: 0 0 24px; line-height: 1.5; }
      button { background: #c2553a; color: #fff; border: 0; border-radius: 12px; padding: 12px 28px;
        font: 600 16px system-ui, sans-serif; }
      [data-lang] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <!-- Drawn inline: images can't be downloaded while offline. -->
      <span class="icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </span>
      <div data-lang="ru">
        <h1>Нет подключения к интернету</h1>
        <p>Проверьте соединение и попробуйте ещё раз.</p>
        <button onclick="location.reload()">Повторить</button>
      </div>
      <div data-lang="kk">
        <h1>Интернет байланысы жоқ</h1>
        <p>Байланысты тексеріп, қайталап көріңіз.</p>
        <button onclick="location.reload()">Қайталау</button>
      </div>
      <div data-lang="en">
        <h1>You're offline</h1>
        <p>Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      // Same order as the site: chosen language (cookie), browser language, Russian.
      var cookie = (document.cookie.match(/(?:^|; )locale=(ru|kk|en)/) || [])[1];
      var browser = (navigator.language || "").slice(0, 2);
      var lang = cookie || (["kk", "en"].indexOf(browser) >= 0 ? browser : "ru");
      document.documentElement.lang = lang;
      document.querySelector('[data-lang="' + lang + '"]').style.display = "block";
    </script>
  </body>
</html>
